name: Inventory Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Inventory Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_db
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventory -d inventory_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Check for relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - 'services/inventory/**'

      - name: Make Maven wrapper executable
        if: steps.changes.outputs.service == 'true'
        run: chmod +x services/inventory/mvnw

      - name: Set up JDK 21
        if: steps.changes.outputs.service == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        if: steps.changes.outputs.service == 'true'
        run: ./mvnw clean verify
        working-directory: services/inventory
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventory_db
          SPRING_DATASOURCE_USERNAME: inventory
          SPRING_DATASOURCE_PASSWORD: inventory
