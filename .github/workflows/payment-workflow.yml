name: Payment Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Payment Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U payment -d payment_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Check for relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - 'services/payment/**'
              - 'services/common/**'

      - name: Make Maven wrappers executable
        if: steps.changes.outputs.service == 'true'
        run: |
          chmod +x services/common/mvnw
          chmod +x services/payment/mvnw

      - name: Set up JDK 21
        if: steps.changes.outputs.service == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and install shared "common" module
        if: steps.changes.outputs.service == 'true'
        run: |
          ./mvnw -B -f ../../pom.xml install -N
          ./mvnw -B install -DskipTests
        working-directory: services/common

      - name: Build and Test with Maven
        if: steps.changes.outputs.service == 'true'
        run: ./mvnw clean verify
        working-directory: services/payment
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payment_db
          SPRING_DATASOURCE_USERNAME: payment
          SPRING_DATASOURCE_PASSWORD: payment
